# Base configuration shared by every run (Sections 2, 3, 8, 14; amendments A1-A6).
# Values frozen after the pilot live in configs/frozen.yaml, not here.
encoder: roberta-base
tasks: [explicit, implicit, hx]
pooling: task
dropout: 0.1
mu: 0.0
aggregation: soft
rationale_target: human
lr: 2.0e-5
weight_decay: 0.01
warmup_frac: 0.06
grad_clip: 1.0
batch_size: 32
eval_batch_size: 128
fp16: true
rounds: 6
round_len_full: 1000
sampling_temperature: 2.0
length_bucketing: true
max_words: 0          # 0 = read W from <splits>/data_stats.json
max_subwords: 0       # 0 = read L from <splits>/subword_limit.json (written by benchmark B0)
threshold_bootstrap: 200
faithfulness_in_run: false
faithfulness_max_posts: 1000
random_draws: 5
splits_dir: /kaggle/input/tox-splits-v1
out_root: /kaggle/working/runs
save_ckpt: false
